server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reservas_futbol_usuarios}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:angelo16}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  mail:
    host: ${MAIL_HOST:smtp.ethereal.email}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:gj2oir3aq62c2uc6@ethereal.email}
    password: ${MAIL_PASSWORD:A2AhbdJR2pUEB2KxCd}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

# Configuración de la app (JWT, CORS, correo)
app:
  jwt:
    secret: ${JWT_SECRET:tuClaveSecretaDeAlMenos256BitsParaHMACSHA256}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}        # 15 minutos
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}   # 7 días
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@tickgo.com}
    inbox-web: ${MAIL_INBOX_WEB:https://ethereal.email/messages}